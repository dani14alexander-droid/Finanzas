{% if items %}
  <div class="automation-list">
    {% for item in items %}
      <div class="debt-item">
        <div>
          <strong>{{ item.persona }}</strong>
          <span>{{ item.categoria }} · {{ item.fecha }} · {{ item.descripcion or "Sin descripcion" }}</span>
          <b class="{{ 'positive' if item.tipo == 'Me deben' else 'negative' }}">{{ item.monto|moneda }}</b>
        </div>
        <form class="debt-payment" method="post" action="{{ url_for('pagar_deuda', deuda_id=item.id) }}">
          <label>
            Fecha de pago
            <input type="date" name="fecha_pago">
          </label>
          <button type="submit">Marcar pagada</button>
        </form>
        <form class="debt-delete" method="post" action="{{ url_for('eliminar_deuda', deuda_id=item.id) }}" data-confirm-delete>
          <button type="submit" class="danger-button">Eliminar</button>
        </form>
      </div>
    {% endfor %}
  </div>
{% else %}
  <p class="empty">{{ empty }}</p>
{% endif %}
